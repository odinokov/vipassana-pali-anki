- term: vipassanupakkilesa
  reading: випассанупаккиле́са
  translation: несовершенства прозрения
  explanation: 'Десять ловушек ранней стадии udayabbaya-ñāṇa (по Paṭisambhidāmagga и Visuddhimagga): свет (obhāsa), знание (ñāṇa), восторг (pīti), умиротворённость (passaddhi), блаженство (sukha), убеждённость (adhimokkha), усилие (paggaha), осознанность (upaṭṭhāna), невозмутимость (upekkhā) и тонкое влечение к ним (nikanti). Сами по себе они не плохи — загрязняет цепляние за них.'
