- term: mettā-bhāvanā
  reading: ме́тта-бха́вана
  translation: развитие доброжелательности
  explanation: Распространение доброжелательности (mettā) на всех существ (sabbe sattā). На курсе Гое́нки вводится на 10-й день и затем завершает каждую медитацию.
