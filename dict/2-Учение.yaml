- term: kamma
  reading: ка́мма
  translation: намеренное действие, карма
  explanation: 'Действие тела, речи или ума (kāya, vacī, mano), движимое намерением (cetanā): «намерение я называю ка́ммой» (AN 6.63). Каждое оставляет след, который при подходящих условиях созревает (vipāka).'
