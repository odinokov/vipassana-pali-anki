- term: bodhipakkhiyā dhammā
  reading: бодхипа́ккхия дха́мма
  translation: 37 качеств, ведущих к пробуждению
  explanation: 'Семь групп (4+4+4+5+5+7+8 = 37), которые Бу́дда перед уходом назвал сутью своего учения (DN 16): основы осознанности (satipaṭṭhāna), правильные усилия (sammappadhāna), основы могущества (iddhipāda), способности (indriya), силы (bala), факторы пробуждения (bojjhaṅga) и благородный восьмеричный путь (magga). Название есть уже в су́ттах (SN 48.51), а счёт «37» закрепился в поздних текстах (Visuddhimagga).'
