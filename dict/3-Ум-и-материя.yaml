- term: saṅkhāra
  reading: санкха́ра
  translation: формирования; реакции ума
  explanation: 'Волевые формирования (cetanā), обусловливающие будущее; четвёртая совокупность и второе звено цепи. У Гое́нки — реакции влечения (rāga) и отвращения (dosa): в випа́ссане старые всплывают и уходят, если не создавать новых. В формуле sabbe saṅkhārā (Dhp 277–278) — вообще всё обусловленное (saṅkhata).'
  parents:
