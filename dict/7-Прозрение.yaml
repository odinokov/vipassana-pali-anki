- term: sotāpattiyaṅga
  reading: сотапаттия́нга
  translation: четыре фактора вхождения в поток
  explanation: 'Условия, ведущие к вхождению в поток (SN 55.5): общение с благими людьми (sappurisa-saṃseva), слушание истинной Дха́ммы (saddhammassavana), мудрое внимание (yoniso manasikāra) и практика в согласии с Дха́ммой (dhammānudhammappaṭipatti). В других су́ттах SN 55 тем же словом названы четыре качества вошедшего в поток (в DN 33 — cattāri sotāpannassa aṅgāni).'
