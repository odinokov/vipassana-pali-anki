- term: Namo tassa bhagavato arahato sammā-sambuddhassa
  reading: На́мо та́сса бхага́вато ара́хато са́мма-самбуддха́сса
  translation: Почтение Ему — Благословенному, Достойному, Полностью Самопробуждённому
  explanation: Традиционная формула почтения Бу́дде; в су́ттах её трижды произносит, например, брахманка Dhanañjānī (SN 7.1). На курсе повторяется трижды перед прибежищем (tisaraṇa) и предписаниями (sīla).
  parents:
