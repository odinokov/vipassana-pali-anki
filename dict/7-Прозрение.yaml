  translation: вошедший в поток
  explanation: 'Отбросил первые три оковы: воззрение о личности (sakkāya-diṭṭhi), сомнение (vicikicchā), цепляние за обряды (sīlabbata-parāmāsa). Освободится не более чем через семь жизней (sattakkhattuparama); AN 3.87 различает три вида вошедших в поток.'
