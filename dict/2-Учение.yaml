- term: samudaya-sacca
  reading: саму́дая-са́чча
  translation: истина о причине страдания
  explanation: 'Причина страдания — жажда (taṇhā): к чувственным удовольствиям (kāma), к существованию (bhava), к несуществованию (vibhava). Причину нужно отбросить (pahātabba).'
