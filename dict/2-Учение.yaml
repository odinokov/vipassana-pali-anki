- term: paṭisandhi
  reading: патиса́ндхи
  translation: связь с новым рождением
  explanation: 'В Абхидха́мме и комментариях — функция (kicca) ума (citta) в первый миг новой жизни: он «соединяет» её с прежней. Следом идёт bhavaṅga, жизнь завершает cuti.'
