- term: ānāpānasati
  reading: анапанаса́ти
  translation: осознанность дыхания
  explanation: Осознанность вдоха и выдоха (āna — вдох, apāna — выдох); в су́ттах (MN 118) — шестнадцать шагов. У Гое́нки — наблюдение естественного дыхания без управления им. На 10-дневном курсе — первые три с половиной дня, для развития сосредоточения (samādhi).
