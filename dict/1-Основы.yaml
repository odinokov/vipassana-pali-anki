- term: bhāvanāmayā paññā
  reading: бхавана́мая па́ння
  translation: мудрость опыта (букв. «мудрость развития»)
  explanation: 'Понимание, рождённое собственной практикой (bhāvanā), — прямое переживание непостоянства (anicca). У Гое́нки акцент: только она освобождает.'
