- term: dhammānupassanā
  reading: дхамманупа́ссана
  translation: созерцание дха́мм
  explanation: 'Наблюдение содержаний ума через категории учения: препятствия (nīvaraṇa), совокупности (khandha), сферы чувств (āyatana), факторы пробуждения (bojjhaṅga), четыре истины (ariyasacca).'
