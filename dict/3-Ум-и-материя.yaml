  translation: мельчайшая частица материи (букв. «группа»)
  explanation: 'Термин комментариев и Абхидха́ммы: неделимая группа материальных свойств (rūpa-kalāpa), мгновенно возникающая и исчезающая. У Гое́нки — то, что открывается при растворении (bhaṅga).'
