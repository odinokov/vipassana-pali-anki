- term: tisikkhā
  reading: тиси́ккха
  translation: три тренировки
  explanation: 'Нравственность (sīla) → сосредоточение (samādhi) → мудрость (paññā): каркас всего пути. В каноне — высшая нравственность, высший ум и высшая мудрость (adhisīla, adhicitta, adhipaññā; DN 33). Курс идёт в том же порядке: предписания, затем ānāpāna, затем vipassanā.'
