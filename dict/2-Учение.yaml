  translation: три характеристики
  explanation: Непостоянство (anicca) и неудовлетворительность (dukkha) — свойства всего обусловленного (sabbe saṅkhārā), безличность (anattā) — всех дха́мм вообще (sabbe dhammā; Dhp 277–279). Сам термин tilakkhaṇa — комментаторский. Прямое постижение трёх характеристик и есть прозрение (vipassanā).
