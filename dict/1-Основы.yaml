  translation: пять предписаний
  explanation: Воздержание (veramaṇī) от убийства (pāṇātipāta), воровства (adinnādāna), сексуальных проступков (kāmesu micchācāra), лжи (musāvāda) и опьяняющих веществ (surā-meraya-majja). На курсе третье предписание понимается как полное воздержание (abrahmacariyā veramaṇī).
