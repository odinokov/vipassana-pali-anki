- term: ekāyano maggo
  reading: эка́яно ма́гго
  translation: прямой путь
  explanation: 'Слова в начале наставления в MN 10 и DN 22: «ekāyano ayaṃ, bhikkhave, maggo» — путь к очищению существ и к осуществлению нибба́ны: четыре satipaṭṭhāna. Значение ekāyana спорно: «прямой», «ведущий в одну сторону».'
