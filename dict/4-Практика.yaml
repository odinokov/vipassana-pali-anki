- term: vipassanā
  reading: випа́ссана
  translation: прозрение, видение как есть
  explanation: 'Ясное, различающее видение (vi- + passanā; у Гое́нки — «видение особым образом»): прямое наблюдение ума и материи (nāmarūpa) в их истинной природе (yathābhūta) — anicca, dukkha, anattā.'
