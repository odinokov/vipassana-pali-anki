- term: kilesa
  reading: киле́са
  translation: загрязнения ума
  explanation: 'Состояния, которые пачкают и мучают ум. В Абхидха́мме (Dhammasaṅgaṇī) их десять: жадность (lobha), ненависть (dosa), заблуждение (moha), самомнение (māna), ложные воззрения (diṭṭhi), сомнение (vicikicchā), вялость (thīna), беспокойство (uddhacca), бесстыдство (ahirika) и отсутствие страха перед дурным (anottappa).'
