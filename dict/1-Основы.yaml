# Випассана::1 Основы: 40 cards. Source of the Anki deck; build.py reads this file (see deck/ for the rest of the package).
#
# One entry per note. Text keys (term, reading, translation, explanation) are plain text; build.py makes the HTML.
# parents:   headword of a parent card, or {section: <title>} = the root of that tree section (a subdeck title);
#            the order of the list is the order of the tree paths on the card.
# children:  headwords, the order of "Включает". see_also: headwords, the order of "Связи".
# opposites: headwords, or {term: ..., gloss: ...} for an opposite that has no card; the order of "Противоположность".
# nid, cid, guid: the ids of the note and the card; keep them, Anki matches notes by them.
# Tags are not stored: build.py derives them from the tree (subdeck, ancestors, headword).
#
# Order of the entries = study order of this subdeck: a card stands after its parents, a child after its parent
# in the order of "Включает". build.py numbers `due` in this order (study_order), subdecks in the order 1..9.
# build.py stops if two cards have the same headword, a reference is unknown, or a relation is one-sided
# (parents <-> children, see_also <-> see_also, opposites <-> opposites).

