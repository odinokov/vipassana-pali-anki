- term: pañcabala
  reading: панча́бала
  translation: пять сил
  explanation: 'Те же пять качеств, что и способности (indriya): в SN 48.43 их сравнивают с двумя рукавами одной реки. По комментариям, это два аспекта, а не две ступени: как способности они управляют своей областью, как силы — не колеблются противоположностями (вера — неверием (assaddhiya), усилие — ленью (kosajja), осознанность — небрежностью (pamāda), сосредоточение — беспокойством (uddhacca), мудрость — неведением (avijjā)).'
