  explanation: 'Материя, зависящая от четырёх великих элементов (mahābhūta): rūpa — это «cattāro ca mahābhūtā, catunnañca mahābhūtānaṃ upādāyarūpaṃ» (SN 12.2). В Абхидха́мме — 24 вида из 28 видов материи.'
