  reading: читтанупа́ссана
  translation: созерцание ума
  explanation: 'Знание текущего состояния ума: со страстью или без (sarāga, vītarāga), с отвращением или без (sadosa, vītadosa), сосредоточенный или нет (samāhita, asamāhita) и т. д.'
