- term: dhamma-sevaka
  reading: дха́мма-се́вака
  translation: служитель Дха́ммы
  explanation: 'Термин традиции Гое́нки: волонтёр, обслуживающий курс (жен. dhamma-sevikā), — кухня, порядок, помощь студентам. Служение (dhamma-sevā) — практика dāna и mettā.'
