- term: saññā
  reading: са́ння
  translation: восприятие, распознавание
  explanation: 'Распознавание: «это синее, это жёлтое» (SN 22.79); третья совокупность. У Гое́нки — ещё и оценка («хорошо/плохо»), которая окрашивает ощущение (vedanā) и запускает реакцию (saṅkhāra).'
