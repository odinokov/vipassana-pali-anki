- term: sampajañña
  reading: сампаджа́ння
  translation: ясное понимание
  explanation: 'В су́ттах (MN 10) — ясное понимание своих действий: при ходьбе, взгляде, сгибании тела; по комментариям — и их цели. У Гое́нки — непрерывное понимание непостоянства (anicca) на уровне ощущений (vedanā), которое важно не терять ни на миг.'
