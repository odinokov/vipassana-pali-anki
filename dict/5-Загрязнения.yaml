- term: anusaya
  reading: ану́сая
  translation: скрытые склонности
  explanation: 'Спящие предрасположенности ума, которые пробуждаются ощущениями (vedanā): к страсти (rāga) — при приятном, к отторжению (paṭigha) — при неприятном, к неведению (avijjā) — при нейтральном. Всего их семь (AN 7.11): kāmarāga, paṭigha, diṭṭhi, vicikicchā, māna, bhavarāga, avijjā.'
