- term: Aniccā vata saṅkhārā
  reading: Ани́чча ва́та санкха́ра
  translation: Поистине непостоянны формирования
  explanation: 'Начало строфы из DN 16. Продолжение: «их природа — возникать и исчезать (uppāda-vaya-dhammino); возникнув, они прекращаются (uppajjitvā nirujjhanti); их умиротворение — счастье (tesaṃ vūpasamo sukho)».'
