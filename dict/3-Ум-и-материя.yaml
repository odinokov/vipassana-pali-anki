- term: cha bāhirāni āyatanāni
  reading: чха́ бахира́ни аятана́ни
  translation: шесть внешних сфер
  explanation: 'Шесть объектов чувств: rūpa (видимое), sadda (звук), gandha (запах), rasa (вкус), phoṭṭhabba (осязаемое), dhammā (объекты ума) — MN 137. Пара к внутренним шести; о внешних идёт речь в SN 35.4.'
