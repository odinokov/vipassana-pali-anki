- term: sotāpatti
  reading: сотапа́тти
  translation: вхождение в поток
  explanation: 'Первая ступень пробуждения: мгновение пути (magga) и плода (phala), когда отпадают первые три оковы (saṃyojana) и переживается нибба́на (nibbāna). «Поток» — благородный восьмеричный путь (SN 55.5). Признаки вошедшего: непоколебимое доверие (aveccappasāda) к Бу́дде, Дха́мме и Са́нгхе и безупречная нравственность (ariyakantāni sīlāni).'
