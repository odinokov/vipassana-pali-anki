- term: Sabbe sattā bhavantu sukhitattā
  reading: Са́ббе са́тта бхава́нту сукхита́тта
  translation: Да будут все существа счастливы
  explanation: Строка из Karaṇīya Mettā Sutta (Snp 1.8; в издании Mahāsaṅgīti — sabbasattā bhavantu sukhitattā); формула mettā — пожелание счастья всем существам без исключения.
