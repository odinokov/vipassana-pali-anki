- term: paramattha-dhamma
  reading: парама́ттха-дха́мма
  translation: четыре высшие реальности
  explanation: 'Категория Абхидха́ммы (Abhidhammattha-saṅgaha): то, что существует в высшем смысле, а не как понятие (paññatti), — ум (citta), ментальные факторы (cetasika), материя (rūpa) и нибба́на (nibbāna). Объект випа́ссаны — первые три, обусловленные; нибба́на — объект пути и плода.'
