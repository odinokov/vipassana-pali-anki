- term: cetasika
  reading: чета́сика
  translation: ментальные факторы
  explanation: 'Качества, сопровождающие каждый момент ума (citta): контакт (phassa), ощущение (vedanā), восприятие (saññā), намерение (cetanā), внимание (manasikāra) и другие. Одни есть в каждом моменте ума, другие — благие (kusala) или неблагие (akusala) — лишь в некоторых. В Абхидха́мме их 52.'
