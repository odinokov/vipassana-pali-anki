- term: samatha
  reading: са́матха
  translation: успокоение
  explanation: 'Медитация безмятежности: сосредоточение (samādhi) на одном объекте. По комментариям, подавляет загрязнения (kilesa) лишь на время; ведёт к jhāna, но само по себе не освобождает.'
