- term: vedanā
  reading: ве́дана
  translation: ощущение, чувство
  explanation: Приятное (sukhā), неприятное (dukkhā) или нейтральное (adukkhamasukhā) качество опыта; вторая совокупность и седьмое звено цепи. У Гое́нки — телесные ощущения, которые наблюдают с невозмутимостью (upekkhā).
