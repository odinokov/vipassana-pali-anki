- term: aṭṭhakathā
  reading: аттхака́тха
  translation: комментарии
  explanation: Толкования к канону; главные составил Buddhaghosa в V веке по древним сингальским комментариям, часть — Dhammapāla и другие авторы. Когда в карточке сказано «по комментариям», речь о них.
