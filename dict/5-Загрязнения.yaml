- term: saṃyojana
  reading: самьо́джана
  translation: десять оков
  explanation: Узы, привязывающие к круговороту рождений (saṃsāra). Первые три отпадают при вхождении в поток (sotāpatti), четвёртая и пятая слабеют у sakadāgāmī (по комментариям) и отпадают у anāgāmī, последние пять — только у арха́та (arahant). В AN 10.13 четвёртая и пятая названы kāmacchanda и byāpāda.
