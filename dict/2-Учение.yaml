- term: pañcupādānakkhandha
  reading: панчупаданаккха́ндха
  translation: пять совокупностей цепляния
  explanation: 'Совокупности (khandha), которые служат предметом цепляния и связаны с āsava (sāsava upādāniya, SN 22.48). Именно они — страдание: «saṅkhittena pañcupādānakkhandhā dukkhā» (SN 56.11).'
