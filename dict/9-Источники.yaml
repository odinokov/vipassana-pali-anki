- term: Dhammacakkappavattana Sutta
  reading: Дхаммачаккаппава́ттана Су́тта
  translation: Запуск колеса Дха́ммы
  explanation: 'Первая проповедь (SN 56.11) пятерым монахам в оленьем парке Isipatana близ Варанаси: срединный путь и четыре благородные истины. В конце Koṇḍañña получает «око Дха́ммы» (dhamma-cakkhu).'
