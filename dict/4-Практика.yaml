  translation: основы осознанности
  explanation: 'Четыре области наблюдения: тело (kāya), ощущения (vedanā), ум (citta), дха́ммы (dhammā). Mahāsatipaṭṭhāna Sutta (DN 22) и Satipaṭṭhāna Sutta (MN 10) — основные тексты випа́ссаны.'
