- term: jhāna
  reading: джха́на
  translation: медитативное поглощение
  explanation: 'Глубокие состояния сосредоточения (samādhi); в су́ттах — четыре jhāna (позднее название — rūpajjhāna) и определение sammā-samādhi. На курсе Гое́нки специально не развиваются. В списке ниже — пять факторов первой jhāna: во второй отпадают vitakka и vicāra, в третьей — pīti, в четвёртой sukha сменяется невозмутимостью (upekkhā).'
  parents:
