- term: nibbāna
  reading: нибба́на
  translation: угасание, освобождение
  explanation: 'Букв. «угасание» огня страсти (rāga), ненависти (dosa) и заблуждения (moha); полное прекращение страдания. Необусловленное (asaṅkhata) — то, что не возникает и не исчезает. Два вида (Itivuttaka 44): с остатком (saupādisesa) — у живого арха́та, без остатка (anupādisesa) — после его кончины.'
