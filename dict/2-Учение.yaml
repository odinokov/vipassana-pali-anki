- term: anattā
  reading: ана́тта
  translation: безличность, не-я
  explanation: 'Ни в теле (rūpa), ни в уме (nāma) нет неизменного «я» (attā) или хозяина — только процесс: «sabbe dhammā anattā» (Dhp 279). Классический довод — во второй проповеди (SN 22.59): непостоянное неудовлетворительно, а неудовлетворительное не может быть «я».'
