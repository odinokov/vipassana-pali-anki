- term: cattāri ariyasaccāni
  reading: чатта́ри ариясачча́ни
  translation: четыре благородные истины
  explanation: 'Суть первой проповеди (SN 56.11): страдание (dukkha), его причина (samudaya), его прекращение (nirodha) и путь к прекращению (magga).'
