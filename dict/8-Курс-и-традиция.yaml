- term: ariyo tuṇhībhāvo
  reading: а́рийо тунхибха́во
  translation: благородная тишина (благородное молчание)
  explanation: '«Либо беседа о Дха́мме, либо благородное молчание» (dhammī vā kathā ariyo vā tuṇhībhāvo, MN 26). На курсе Гое́нки — тишина тела, речи и ума: без разговоров, жестов и записок; вопросы — только учителю и менеджеру.'
  parents:
