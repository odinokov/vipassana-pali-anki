- term: punabbhava
  reading: пуна́ббхава
  translation: повторное существование, новое рождение
  explanation: 'Новое становление после смерти (puna «снова» + bhava). Жажда (taṇhā) — ponobbhavikā, «ведущая к новому существованию» (SN 56.11). Бу́дда о себе: «natthi dāni punabbhavo» — «нового существования больше нет».'
