- term: dukkha-sacca
  reading: ду́ккха-са́чча
  translation: истина о страдании
  explanation: Рождение (jāti), старость (jarā), болезнь (byādhi), смерть (maraṇa), встреча с неприятным, разлука с приятным, неполучение желаемого — страдание; «пять совокупностей цепляния (pañcupādānakkhandhā) — страдание» (SN 56.11). Эту истину нужно полностью понять (pariññeyya).
