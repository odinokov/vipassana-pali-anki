- term: paramparā
  reading: пара́мпара
  translation: преемственность (линия учителей)
  explanation: 'Передача от учителя к ученику. В традиции Гое́нки — линия: Леди Сая́до, Сайя Тхетджи, Саяджи У Ба Кхин, С. Н. Гое́нка. В AN 3.65 Бу́дда советует не полагаться на одну лишь преемственность (paramparā), а проверять самому.'
