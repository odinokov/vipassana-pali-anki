- term: kammassakatā
  reading: каммасса́ката
  translation: владение своей ка́ммой
  explanation: 'Осознание, что ты владелец своих поступков: «kammassakomhi kammadāyādo» — «я владелец ка́ммы, наследник ка́ммы» (AN 5.57). В AN 5.161 — способ унять обиду на человека: «kammassako ayamāyasmā» — он владелец своей ка́ммы.'
