- term: kusala-mūla
  reading: ку́сала-му́ла
  translation: три корня благого
  explanation: Нежадность (alobha), неотвращение (adosa) и незаблуждение (amoha) — корни всех благих (kusala) состояний и поступков. Проявляются как щедрость (dāna), доброжелательность (mettā) и мудрость (paññā).
